version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      tls-deps:
        patterns:
          - "rustls*"
          - "webpki*"
          - "tokio-rustls"
          - "hyper-rustls"
    labels:
      - "dependencies"
      - "security"
